<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NightWither Unity — Alle Kanäle</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src https://firestore.googleapis.com https://nwu-anmeldung.nwu-brand.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="description" content="Alle Kanäle von NightWither Unity: Discord, Twitch, TikTok, YouTube, Instagram, Kick, Spotify und mehr.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="NightWither Unity — Alle Kanäle">
<meta property="og:description" content="Discord, Twitch, TikTok, YouTube, Instagram, Kick, Spotify und mehr. Alles an einem Ort.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nightwither.de/">
<meta property="og:image" content="https://nightwither.de/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/rajdhani-700.woff" as="font" type="font/woff" crossorigin>
<style>
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/rajdhani-700.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-400.woff') format('woff'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --gold-hi: #e8c96d;
    --text: #e8e8e8;
    --muted: #8f8a80;
    --panel: #0d0d10;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html { scroll-behavior: smooth; }

  ::selection { background: rgba(201,168,76,0.3); color: var(--text); }

  .skip {
    position: absolute;
    left: -9999px;
    top: 8px;
    z-index: 100;
    background: var(--gold);
    color: #000;
    padding: 10px 16px;
    font-weight: 600;
    border-radius: 4px;
    text-decoration: none;
  }
  .skip:focus { left: 8px; }

  body {
    background: #000000;
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    position: relative;
  }

  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* Hexenmodus-Sigils: eigener Canvas ueber den Karten, nicht dahinter */
  #hex-sigil-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  .content {
    position: relative;
    z-index: 2;
  }

  .header {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
  }
  body.first-visit .header { animation: fadeDown 0.6s ease both; }

  .logo-btn {
    background: none;
    border: 0;
    padding: 4px;
    margin: 0;
    border-radius: 50%;
    cursor: pointer;
    line-height: 0;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.25s var(--ease), opacity 0.5s ease;
  }
  .logo-btn:hover { transform: scale(1.05); }
  .logo-btn:active { transform: scale(0.97); }
  .logo-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  .logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 0 18px rgba(201,168,76,0.35));
    transition: filter 0.6s ease;
    animation: crownFloat 6s ease-in-out 1.2s infinite;
  }

  .header-title {
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(1.4rem, 7vw, 2rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: opacity 0.5s ease;
  }

  .header-title span {
    display: inline-block;
    color: var(--text);
  }
  body.first-visit .header-title span {
    clip-path: inset(0 0 100% 0);
    animation: titleWipe 0.85s var(--ease) 0.5s both;
  }
  @keyframes titleWipe {
    to { clip-path: inset(0 0 0 0); }
  }

  /* Ein paar Goldtropfen, die einmal von der Krone fallen (nur beim ersten Besuch) */
  .intro-drips {
    position: absolute;
    top: 96px;
    left: 50%;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .intro-drips span {
    position: absolute;
    top: 0;
    width: 3px;
    height: 12px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--gold-hi), transparent);
    opacity: 0;
  }
  .intro-drips span:nth-child(1) { left: -10px; }
  .intro-drips span:nth-child(2) { left: 6px; }
  body.first-visit .intro-drips span {
    animation: dripFall 1.1s ease-in 0.95s both;
  }
  body.first-visit .intro-drips span:nth-child(2) {
    animation-delay: 1.15s;
  }
  @keyframes dripFall {
    0%   { opacity: 0; transform: translateY(0) scaleY(1); }
    18%  { opacity: 0.85; }
    100% { opacity: 0; transform: translateY(64px) scaleY(1.7); }
  }

  .header-sub {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity 0.5s ease 0.15s;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 480px;
  }

  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.25s var(--ease), background 0.25s var(--ease), transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    backdrop-filter: blur(4px);
    box-shadow: 0 8px 20px -14px rgba(0,0,0,0.8);
  }

  /* Rangfolge: Discord und Twitch sind der Haupteinstieg (Goldkante + Schimmer),
     der Shop hebt sich mit der Kante allein von der Utility-Gruppe ab. Alles andere
     bleibt neutral - die Hierarchie entsteht durch Zuwachs oben, nicht durch
     Abwertung unten. */
  .link-card.primary {
    border-color: rgba(201,168,76,0.38);
    background:
      linear-gradient(135deg, rgba(201,168,76,0.11) 0%, rgba(201,168,76,0.03) 55%, rgba(201,168,76,0) 100%),
      rgba(0, 0, 0, 0.3);
    padding: 16px;
  }
  /* Der Lichtstreif liegt auf einem eigenen Pseudo-Element, nicht auf der Karte:
     die Karte traegt beim ersten Besuch schon die fadeUp-Intro, und zwei
     Animationen auf einem Element wuerden sich gegenseitig ersetzen. */
  .link-card.primary::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(105deg,
      transparent 35%,
      rgba(232,201,109,0.06) 47%,
      rgba(255,248,228,0.09) 50%,
      rgba(232,201,109,0.06) 53%,
      transparent 65%);
    background-size: 260% 100%;
    background-position: 0 0;
    background-repeat: no-repeat;
    animation: cardSheen 10s linear 2.5s infinite;
  }
  .link-card.primary:nth-of-type(2)::before { animation-delay: 7.5s; }
  /* Streif zieht einmal durch, danach lange Ruhe bis zum naechsten Durchlauf. */
  @keyframes cardSheen {
    0%   { background-position: 0 0; }
    32%  { background-position: 100% 0; }
    100% { background-position: 100% 0; }
  }
  /* Inhalt bleibt ueber dem Streif. */
  .link-card .link-icon,
  .link-card .link-text,
  .link-card .link-arrow { position: relative; }
  .link-card.primary:hover { border-color: var(--gold); }
  .link-card.primary .link-icon { width: 44px; height: 44px; border-radius: 10px; }
  .link-card.primary .link-icon svg { width: 22px; height: 22px; }
  .link-card.primary .link-name { font-size: 1.05rem; }

  .link-card.accent { border-color: rgba(201,168,76,0.38); }
  .link-card.accent:hover { border-color: var(--gold); }

  .link-card::after {
    content: '';
    position: absolute;
    inset: 5px;
    pointer-events: none;
    --c: var(--gold);
    --l: 10px;
    --w: 2px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--w) var(--l) no-repeat;
    opacity: 0;
    transform: scale(1.06);
    transition: opacity 0.25s, transform 0.35s var(--ease);
    border-radius: 4px;
  }

  .link-card:hover {
    border-color: var(--gold);
    background: rgba(201, 168, 76, 0.08);
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -16px rgba(0,0,0,0.9);
  }

  .link-card:hover::after,
  .link-card:focus-visible::after { opacity: 1; transform: none; }

  .link-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.3s var(--ease);
  }

  .link-card:hover .link-icon {
    transform: scale(1.08);
  }

  .link-icon svg { width: 18px; height: 18px; fill: white; }

  .link-text { flex: 1; min-width: 0; }

  .link-name {
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  .link-arrow {
    display: flex;
    flex-shrink: 0;
    color: var(--muted);
    transition: color 0.2s, transform 0.25s var(--ease);
  }
  .link-arrow svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .link-card:hover .link-arrow { color: var(--gold); transform: translateX(2px); }

  .ic-discord  { background: #5865f2; }
  .ic-twitch   { background: #9146ff; }

  .live-badge {
    position: absolute;
    top: 8px;
    right: 44px;
    background: rgba(220, 38, 38, 0.9);
    color: #fff;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    animation: pulse 2s infinite;
    z-index: 10;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.95); }
  }
  .ic-tiktok   { background: #010101; }
  .ic-spotify  { background: #1db954; }
  .ic-youtube  { background: #ff0000; }
  .ic-kick     { background: #53fc18; }
  .ic-insta    { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
  .ic-shop     { background: linear-gradient(135deg, #2a1a0e, #3d2610); border: 1px solid rgba(201,168,76,0.4); }

  .divider {
    width: 100%;
    max-width: 480px;
    height: 1px;
    background: var(--border);
    margin: 6px 0;
  }
  body.first-visit .link-card,
  body.first-visit .divider,
  body.first-visit .legal {
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-timing-function: ease;
    animation-fill-mode: both;
  }
  .legal { animation-delay: 0.76s; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes crownFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  /* Direkte Kinder von .links: 1 Discord, 2 Twitch, 3 .tiles, 4 .divider, 5-8 die restlichen Karten */
  .link-card:nth-child(1) { animation-delay: 0.10s; }
  .link-card:nth-child(2) { animation-delay: 0.18s; }
  .divider                { animation-delay: 0.4s; }
  .link-card:nth-child(5) { animation-delay: 0.44s; }
  .link-card:nth-child(6) { animation-delay: 0.52s; }
  .link-card:nth-child(7) { animation-delay: 0.60s; }
  .link-card:nth-child(8) { animation-delay: 0.68s; }
  /* Kompakte Kacheln in zwei Spalten */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .link-card.tile { gap: 10px; padding: 12px; min-width: 0; }
  .link-card.tile .link-name { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tiles .link-card:nth-child(1) { animation-delay: 0.26s; }
  .tiles .link-card:nth-child(2) { animation-delay: 0.32s; }
  .tiles .link-card:nth-child(3) { animation-delay: 0.38s; }
  .tiles .link-card:nth-child(4) { animation-delay: 0.44s; }
  .tiles .link-card:nth-child(5) { animation-delay: 0.50s; }
  .tiles .link-card:nth-child(6) { animation-delay: 0.56s; }

  .legal { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 18px; }
  .legal a { color: var(--muted); font-size: 0.8rem; text-decoration: none; padding: 14px 12px; min-height: 44px; display: inline-flex; align-items: center; transition: color 0.2s; }
  .legal a:hover, .legal a:focus-visible { color: var(--gold); }
  .legal span { color: #444; }

  /* ---------- Feature 2: Hexenmodus ---------- */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px;
  }

  body.hex-drawing .logo-btn,
  body.hex-hold .logo-btn,
  body.hex-drawing .header-title,
  body.hex-hold .header-title {
    opacity: 0 !important;
    pointer-events: none;
  }
  body.hex-exit .logo-btn,
  body.hex-exit .header-title {
    opacity: 1 !important;
    transition: opacity 0.7s ease 0.15s;
  }

  /* Subtitle verschwindet mit, kommt aber mit anderem Text zurueck, sobald das Pentagramm fertig gezeichnet ist */
  body.hex-drawing .header-sub,
  body.hex-exit .header-sub {
    opacity: 0 !important;
  }
  body.hex-hold .header-sub {
    opacity: 1 !important;
  }

  .hex-overlay {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 20px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
  }
  .hex-overlay.hex-active {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s ease;
  }

  .hex-stage {
    position: relative;
    width: min(46vw, 175px);
    aspect-ratio: 1 / 1;
    overflow: visible;
  }

  .hex-pentagram {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 6px rgba(201,168,76,0.5));
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  body.hex-drawing .hex-pentagram,
  body.hex-hold .hex-pentagram { opacity: 1; }
  body.hex-exit .hex-pentagram { opacity: 0; transition: opacity 1s ease; }

  .hex-circle {
    fill: none;
    stroke: var(--gold);
    stroke-width: 2.4;
    opacity: 0.8;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  .hex-star {
    fill: none;
    stroke: var(--gold-hi);
    stroke-width: 3.6;
    stroke-linejoin: round;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  body.hex-drawing .hex-circle { animation: hexDraw 1.5s var(--ease) both; }
  body.hex-drawing .hex-star   { animation: hexDraw 3.9s var(--ease) 1.05s both; }
  body.hex-hold .hex-circle,
  body.hex-hold .hex-star { stroke-dashoffset: 0; }
  @keyframes hexDraw { to { stroke-dashoffset: 0; } }

  /* Wandernder Lichtfunke: haelt das Pentagramm beim Stehen lebendig */
  .hex-circle-glow,
  .hex-star-glow {
    fill: none;
    stroke: #fff9e6;
    stroke-linecap: round;
    opacity: 0;
  }
  .hex-circle-glow { stroke-width: 3.2; stroke-dasharray: 0.05 0.95; }
  .hex-star-glow   { stroke-width: 4; stroke-linejoin: round; stroke-dasharray: 0.045 0.955; }
  body.hex-hold .hex-circle-glow,
  body.hex-hold .hex-star-glow {
    opacity: 0.85;
    animation: hexTravel 2.8s linear infinite;
  }
  body.hex-hold .hex-star-glow { animation-duration: 3.6s; }
  @keyframes hexTravel {
    from { stroke-dashoffset: 1; }
    to   { stroke-dashoffset: 0; }
  }

  .hex-smoke {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hex-smoke span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 38px;
    height: 38px;
    margin: -19px 0 0 -19px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(236,230,255,0.55), rgba(190,180,200,0.22) 55%, transparent 76%);
    filter: blur(4px);
    opacity: 0;
  }
  .hex-smoke.hex-smoke-active span { animation: hexSmokePuff 1.4s ease-out both; }
  .hex-smoke span:nth-child(1) { transform: translate(-32px, 6px); animation-delay: 0s; }
  .hex-smoke span:nth-child(2) { transform: translate(16px, -10px); animation-delay: 0.06s; }
  .hex-smoke span:nth-child(3) { transform: translate(0, 16px); animation-delay: 0.12s; }
  .hex-smoke span:nth-child(4) { transform: translate(-16px, -18px); animation-delay: 0.18s; }
  .hex-smoke span:nth-child(5) { transform: translate(30px, 8px); animation-delay: 0.24s; }
  @keyframes hexSmokePuff {
    0%   { opacity: 0; }
    22%  { opacity: 0.85; }
    100% { opacity: 0; transform: translateY(-70px) scale(2.2); filter: blur(10px); }
  }

  /* ---------- Feature 3: Blutmond (Krone lange gedrueckt halten) ---------- */
  .blutmond {
    position: fixed;
    inset: 0;
    z-index: 70;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at 50% 15%,
      rgba(139,0,0,0) 0%,
      rgba(139,0,0,0.08) 40%,
      rgba(107,15,26,0.28) 75%,
      rgba(74,6,6,0.5) 100%);
  }
  body.blutmond-active .blutmond { animation: blutmondIn 0.6s ease both; }
  body.blutmond-exit .blutmond   { animation: blutmondOut 1.2s ease both; }
  @keyframes blutmondIn  { to   { opacity: 1; } }
  @keyframes blutmondOut { from { opacity: 1; } to { opacity: 0; } }
  body.blutmond-active .logo { filter: drop-shadow(0 0 18px rgba(180,20,20,0.65)); }

  /* ---------- Geheimnisse: Rabattcode-Karte ---------- */
  .secret-reveal {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 90;
    width: min(90vw, 360px);
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 20px 22px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, 12px) scale(0.96);
    transition: opacity 0.35s var(--ease), transform 0.35s var(--ease), visibility 0s linear 0.35s;
  }
  .secret-reveal.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translate(-50%, 0) scale(1);
    transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
  }
  .secret-close {
    position: absolute;
    top: 2px;
    right: 4px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: color 0.2s;
  }
  .secret-close:hover, .secret-close:focus-visible { color: var(--gold); }
  .secret-title {
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gold-hi);
    margin-bottom: 8px;
    padding-right: 20px;
  }
  .secret-code {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    letter-spacing: 0.12em;
    color: var(--text);
    background: rgba(201,168,76,0.12);
    border: 1px dashed rgba(201,168,76,0.5);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .secret-code:hover, .secret-code:focus-visible {
    background: rgba(201,168,76,0.18);
    border-color: var(--gold);
  }
  .secret-code-icon {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .secret-code.kopiert { border-style: solid; border-color: var(--gold); }
  .secret-code.kopiert .secret-code-icon { stroke: var(--gold-hi); }
  .secret-note {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .secret-progress {
    margin-top: 8px;
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* Shop-Karte traegt das zweite Geheimnis: langes Halten. Ohne diese beiden
     Zeilen kaempft das Halten am Handy gegen Textauswahl und Link-Vorschau. */
  .link-card.accent {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .link-card.secret-near { animation: secretNear 0.8s ease-in-out; }
  @keyframes secretNear {
    0%, 100% { border-color: rgba(201,168,76,0.38); }
    50%      { border-color: var(--gold-hi); }
  }
  .secret-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 14px;
    background: var(--gold);
    color: #000;
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 4px;
    transition: background 0.2s;
  }
  .secret-cta:hover, .secret-cta:focus-visible { background: var(--gold-hi); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    /* Endlos-Animationen brauchen ein echtes Aus. Nur die Dauer auf 0.01ms zu
       setzen liesse sie zehntausendfach pro Sekunde durchlaufen - genau das
       Flackern, das die Einstellung verhindern soll. */
    .link-card.primary::before, .logo, .live-badge,
    .hex-circle-glow, .hex-star-glow {
      animation: none !important;
    }
    .link-card.primary::before { opacity: 0; }
  }
</style>
