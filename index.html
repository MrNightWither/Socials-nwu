<style>
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/rajdhani-500.woff') format('woff'); }
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/rajdhani-700.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-400.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/inter-500.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/inter-600.woff') format('woff'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0d;
    --surface: #111116;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.15);
    --text: #e8e8e8;
    --muted: #666;
    --coming: #2a2a2a;
  }

  body {
    background: #000000;
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 2;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 0 18px rgba(201,168,76,0.35));
  }

  .header-title {
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #d4a94f 0%, #f0d080 50%, #b8872a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-sub {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 480px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    animation: fadeUp 0.5s ease both;
    backdrop-filter: blur(2px);
  }

  .link-card:hover {
    border-color: var(--gold);
    background: rgba(201, 168, 76, 0.08);
    transform: translateY(-2px);
  }

  .link-card.coming-soon {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }

  .link-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .link-icon svg { width: 18px; height: 18px; fill: white; }

  .link-text { flex: 1; }

  .link-name {
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .link-badge {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 2px;
  }

  .link-arrow {
    color: var(--muted);
    font-size: 1rem;
    transition: color 0.2s;
  }

  .link-card:hover .link-arrow { color: var(--gold); }

  .ic-discord  { background: #5865f2; }
  .ic-twitch   { background: #9146ff; }

  .live-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(220, 38, 38, 0.9);
    color: #fff;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    animation: pulse 2s infinite;
    z-index: 10;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.95); }
  }
  .ic-tiktok   { background: #010101; }
  .ic-spotify  { background: #1db954; }
  .ic-youtube  { background: #ff0000; }
  .ic-kick     { background: #53fc18; }
  .ic-insta    { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
  .ic-app      { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid rgba(201,168,76,0.4); }
  .ic-shop     { background: linear-gradient(135deg, #2a1a0e, #3d2610); border: 1px solid rgba(201,168,76,0.4); }

  .divider {
    width: 100%;
    max-width: 480px;
    height: 1px;
    background: var(--border);
    margin: 6px 0;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .link-card:nth-child(1) { animation-delay: 0.10s; }
  .link-card:nth-child(2) { animation-delay: 0.17s; }
  .link-card:nth-child(3) { animation-delay: 0.24s; }
  .link-card:nth-child(4) { animation-delay: 0.31s; }
  .link-card:nth-child(5) { animation-delay: 0.38s; }
  .link-card:nth-child(6) { animation-delay: 0.45s; }
  .link-card:nth-child(7) { animation-delay: 0.52s; }
  .divider               { animation-delay: 0.57s; }
  .link-card:nth-child(9)  { animation-delay: 0.62s; }
  .link-card:nth-child(10) { animation-delay: 0.69s; }
</style>
</head>
